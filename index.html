<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Time Zones Explorer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0b1120;
      color: #f8fafc;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 860px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      color: #38bdf8;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .hero-clocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .hero-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .hero-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .hero-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.65rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    .hero-sub {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 0.25rem;
    }

    .controls-panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .slider-wrap {
      margin-top: 0.9rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      cursor: pointer;
    }

    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      font-weight: 600;
    }

    button.primary:hover {
      background: #1d4ed8;
    }

    button:hover {
      background: #334155;
    }

    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 1rem;
    }

    .zone-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .zone-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .zone-city {
      font-weight: 700;
      font-size: 1.05rem;
      color: #f8fafc;
    }

    .zone-offset {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
    }

    .zone-id {
      font-size: 0.78rem;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .zone-clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 0.25rem;
    }

    .zone-date {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    #error-banner {
      display: none;
      background: #7f1d1d;
      color: #fef2f2;
      border: 1px solid #ef4444;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="error-banner"></div>

    <h1>World Time Zones Explorer</h1>
    <p class="subtitle">Compare live clocks around the world, check GMT/UTC offsets, or scrub hours forward and backward.</p>

    <div class="hero-clocks">
      <div class="hero-box">
        <div class="hero-label">Your Local Time</div>
        <div id="hero-local-time" class="hero-time">--:--:--</div>
        <div id="hero-local-meta" class="hero-sub">Detecting time zone...</div>
      </div>

      <div class="hero-box">
        <div class="hero-label">Greenwich Mean Time (GMT)</div>
        <div id="hero-gmt-time" class="hero-time">--:--:--</div>
        <div id="hero-gmt-date" class="hero-sub">Loading GMT...</div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls-row">
        <div>
          <label for="add-zone-select" style="font-size: 0.88rem; color: #cbd5e1; margin-right: 0.4rem;">Add Time Zone:</label>
          <select id="add-zone-select"></select>
          <button id="add-zone-btn" type="button">Add Clock</button>
        </div>
        <button id="reset-offset-btn" class="primary" type="button">Reset to Now (0h)</button>
      </div>

      <div class="slider-wrap">
        <div class="slider-header">
          <span>Time Shift Offset:</span>
          <strong id="offset-readout">+0 hours</strong>
        </div>
        <input id="offset-slider" type="range" min="-24" max="24" step="1" value="0">
      </div>
    </div>

    <div id="zones-grid" class="zones-grid"></div>
  </div>

  <script>
    window.onerror = function (msg, url, line) {
      var banner = document.getElementById("error-banner");
      if (banner) {
        banner.style.display = "block";
        banner.textContent = "JS Error (line " + line + "): " + msg;
      }
      return false;
    };

    (function () {
      const PRESET_ZONES = [
        { city: "Dublin / Monksland", tz: "Europe/Dublin" },
        { city: "London", tz: "Europe/London" },
        { city: "New York", tz: "America/New_York" },
        { city: "Chicago / Green Bay", tz: "America/Chicago" },
        { city: "Los Angeles", tz: "America/Los_Angeles" },
        { city: "Tokyo", tz: "Asia/Tokyo" },
        { city: "Sydney", tz: "Australia/Sydney" },
        { city: "Paris", tz: "Europe/Paris" },
        { city: "Berlin", tz: "Europe/Berlin" },
        { city: "Phnom Penh", tz: "Asia/Phnom_Penh" },
        { city: "Reykjavik", tz: "Atlantic/Reykjavik" },
        { city: "Auckland", tz: "Pacific/Auckland" }
      ];

      let activeZones = [
        "Europe/Dublin",
        "America/New_York",
        "America/Chicago",
        "Asia/Tokyo",
        "Europe/Paris",
        "Australia/Sydney"
      ];

      let hourOffset = 0;

      function getOffsetLabel(tz, dateObj) {
        try {
          const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: tz,
            timeZoneName: "shortOffset"
          }).formatToParts(dateObj);
          const tzPart = parts.find(function (p) { return p.type === "timeZoneName"; });
          return tzPart ? tzPart.value : "UTC";
        } catch (e) {
          return "UTC";
        }
      }

      function formatTime(tz, dateObj) {
        return new Intl.DateTimeFormat("en-GB", {
          timeZone: tz,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        }).format(dateObj);
      }

      function formatDate(tz, dateObj) {
        return new Intl.DateTimeFormat("en-GB", {
          timeZone: tz,
          weekday: "short",
          day: "2-digit",
          month: "short",
          year: "numeric"
        }).format(dateObj);
      }

      function populateDropdown() {
        const select = document.getElementById("add-zone-select");
        select.innerHTML = "";
        PRESET_ZONES.forEach(function (item) {
          const opt = document.createElement("option");
          opt.value = item.tz;
          opt.textContent = item.city + " (" + item.tz + ")";
          select.appendChild(opt);
        });
      }

      function getCityName(tz) {
        const match = PRESET_ZONES.find(function (z) { return z.tz === tz; });
        if (match) return match.city;
        const pieces = tz.split("/");
        return pieces[pieces.length - 1].replace(/_/g, " ");
      }

      function renderCards(shiftedDate) {
        const grid = document.getElementById("zones-grid");
        grid.innerHTML = "";

        activeZones.forEach(function (tz) {
          const card = document.createElement("div");
          card.className = "zone-card";

          const top = document.createElement("div");
          top.className = "zone-top";

          const cityEl = document.createElement("div");
          cityEl.className = "zone-city";
          cityEl.textContent = getCityName(tz);

          const offsetEl = document.createElement("span");
          offsetEl.className = "zone-offset";
          offsetEl.textContent = getOffsetLabel(tz, shiftedDate);

          top.appendChild(cityEl);
          top.appendChild(offsetEl);

          const idEl = document.createElement("div");
          idEl.className = "zone-id";
          idEl.textContent = tz;

          const clockEl = document.createElement("div");
          clockEl.className = "zone-clock";
          clockEl.textContent = formatTime(tz, shiftedDate);

          const dateEl = document.createElement("div");
          dateEl.className = "zone-date";
          dateEl.textContent = formatDate(tz, shiftedDate);

          card.appendChild(top);
          card.appendChild(idEl);
          card.appendChild(clockEl);
          card.appendChild(dateEl);
          grid.appendChild(card);
        });
      }

      function updateClocks() {
        const nowMs = Date.now() + hourOffset * 3600 * 1000;
        const shiftedDate = new Date(nowMs);

        const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        document.getElementById("hero-local-time").textContent = formatTime(localTz, shiftedDate);
        document.getElementById("hero-local-meta").textContent = localTz + " • " + formatDate(localTz, shiftedDate);

        document.getElementById("hero-gmt-time").textContent = formatTime("GMT", shiftedDate);
        document.getElementById("hero-gmt-date").textContent = formatDate("GMT", shiftedDate);

        renderCards(shiftedDate);
      }

      function init() {
        populateDropdown();

        const slider = document.getElementById("offset-slider");
        const offsetReadout = document.getElementById("offset-readout");
        const resetBtn = document.getElementById("reset-offset-btn");
        const addBtn = document.getElementById("add-zone-btn");
        const zoneSelect = document.getElementById("add-zone-select");

        slider.addEventListener("input", function () {
          hourOffset = parseInt(slider.value, 10) || 0;
          offsetReadout.textContent = (hourOffset >= 0 ? "+" : "") + hourOffset + " hours";
          updateClocks();
        });

        resetBtn.addEventListener("click", function () {
          hourOffset = 0;
          slider.value = "0";
          offsetReadout.textContent = "+0 hours";
          updateClocks();
        });

        addBtn.addEventListener("click", function () {
          const chosen = zoneSelect.value;
          if (chosen && activeZones.indexOf(chosen) === -1) {
            activeZones.push(chosen);
            updateClocks();
          }
        });

        updateClocks();
        setInterval(updateClocks, 1000);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
