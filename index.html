<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Time Zones Explorer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      min-height: 100vh;
      background: #0b1120;
      color: #f8fafc;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 920px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      color: #38bdf8;
    }

    .subtitle {
      margin: 0 0 1.5rem;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .hero-clocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .hero-box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .hero-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      margin-bottom: 0.35rem;
    }

    .hero-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.65rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }

    .hero-sub {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-top: 0.25rem;
    }

    .controls-panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      justify-content: space-between;
    }

    .add-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .slider-wrap {
      margin-top: 0.9rem;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      color: #cbd5e1;
      margin-bottom: 0.4rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }

    input[type="text"], select, button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.9rem;
    }

    input[type="text"] {
      min-width: 170px;
    }

    select {
      max-width: 300px;
      cursor: pointer;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      font-weight: 600;
    }

    button.primary:hover {
      background: #1d4ed8;
    }

    button:hover {
      background: #334155;
    }

    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 1rem;
    }

    .zone-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      position: relative;
    }

    .zone-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }

    .zone-city {
      font-weight: 700;
      font-size: 1.02rem;
      color: #f8fafc;
    }

    .zone-badges {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .zone-offset {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    .remove-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.1rem 0.4rem;
      font-size: 0.75rem;
      border-radius: 6px;
      line-height: 1.2;
    }

    .remove-btn:hover {
      color: #f8fafc;
      background: #7f1d1d;
      border-color: #ef4444;
    }

    .zone-id {
      font-size: 0.78rem;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      word-break: break-word;
    }

    .zone-clock {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 1.3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 0.25rem;
    }

    .zone-date {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    #error-banner {
      display: none;
      background: #7f1d1d;
      color: #fef2f2;
      border: 1px solid #ef4444;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="error-banner"></div>

    <h1>World Time Zones Explorer</h1>
    <p class="subtitle">Browse world time zones—including Pago Pago and Apia—check live clocks and offsets, or scrub hours forward and backward.</p>

    <div class="hero-clocks">
      <div class="hero-box">
        <div class="hero-label">Your Local Time</div>
        <div id="hero-local-time" class="hero-time">--:--:--</div>
        <div id="hero-local-meta" class="hero-sub">Detecting time zone...</div>
      </div>

      <div class="hero-box">
        <div class="hero-label">Greenwich Mean Time (GMT)</div>
        <div id="hero-gmt-time" class="hero-time">--:--:--</div>
        <div id="hero-gmt-date" class="hero-sub">Loading GMT...</div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls-row">
        <div class="add-group">
          <input id="zone-filter-input" type="text" placeholder="Filter (e.g. Pago Pago, Apia)..." aria-label="Filter time zones">
          <select id="add-zone-select" aria-label="Select time zone"></select>
          <button id="add-zone-btn" type="button">Add Clock</button>
          <button id="add-all-btn" type="button">Add All (<span id="total-zones-count">0</span>)</button>
        </div>
        <button id="reset-offset-btn" class="primary" type="button">Reset to Now (0h)</button>
      </div>

      <div class="slider-wrap">
        <div class="slider-header">
          <span>Time Shift Offset:</span>
          <strong id="offset-readout">+0 hours</strong>
        </div>
        <input id="offset-slider" type="range" min="-24" max="24" step="1" value="0">
      </div>
    </div>

    <div id="zones-grid" class="zones-grid"></div>
  </div>
